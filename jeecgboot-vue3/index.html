<!DOCTYPE html>
<html lang="zh_CN" id="htmlRoot">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
    <meta name="renderer" content="webkit" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1.0,minimum-scale=1.0,maximum-scale=1.0,user-scalable=0"
    />

    <title><%= title %></title>
    <link rel="icon" href="<%= basePublicPath %>/logo.png" />
    <!-- 全局配置 -->
    <script>
      window._CONFIG = {};
    </script>
  </head>
  <body>
    <script>
      (() => {
        var htmlRoot = document.getElementById('htmlRoot');
        var theme = window.localStorage.getItem('__APP__DARK__MODE__');
        if (htmlRoot && theme) {
          htmlRoot.setAttribute('data-theme', theme);
          theme = htmlRoot = null;
        }
      })();
    </script>
    <div id="app">
      <!--
        UI Redesign: 加载状态页（首次渲染前，浏览器已拿到 HTML 但 main.ts/Vue 还没挂载）
        设计稿: jeecgboot-ui/pages/loading-final.html
          - 跳动方块 Loader（5 根条 + 高度 8→56 的 bounce）
          - 品牌标题 + 副标题
          - 底部 sliding gradient 进度条
          - 背景双 radial gradient + 细网格 dot pattern
        色彩用项目主色 #5B6CFF，而非设计稿示例的 #1A56FF，以与登录页/应用壳一致
      -->
      <style>
        .app-loading {
          position: relative;
          display: flex;
          flex-direction: column;
          width: 100%;
          height: 100%;
          min-height: 100vh;
          justify-content: center;
          align-items: center;
          gap: 36px;
          padding: 24px;
          box-sizing: border-box;
          background:
            radial-gradient(circle at 28% 22%, rgba(110, 150, 255, 0.16), transparent 45%),
            radial-gradient(circle at 75% 78%, rgba(210, 180, 255, 0.16), transparent 45%),
            linear-gradient(180deg, #ffffff 0%, #f5f8ff 100%);
          color: #0f172a;
          font-family: 'PingFang SC', 'Microsoft YaHei', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
          -webkit-font-smoothing: antialiased;
        }

        /* 背景细网格点阵 */
        .app-loading::before {
          content: '';
          position: absolute;
          inset: 0;
          pointer-events: none;
          background-image: radial-gradient(rgba(15, 23, 42, 0.04) 1px, transparent 1.5px);
          background-size: 28px 28px;
          opacity: 0.7;
        }

        .app-loading-wrap {
          position: relative;
          z-index: 1;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 36px;
        }

        /* ===== Loader: 5 根跳动方块 ===== */
        .jeecg-loader {
          display: flex;
          gap: 10px;
          align-items: flex-end;
          height: 64px;
        }

        .jeecg-loader .bar {
          width: 12px;
          height: 8px;
          background: linear-gradient(180deg, #7e8dff, #5b6cff);
          border-radius: 3px;
          animation: jeecgBounce 1.1s ease-in-out infinite;
        }

        .jeecg-loader .bar:nth-child(1) { animation-delay: -0.45s; }
        .jeecg-loader .bar:nth-child(2) { animation-delay: -0.30s; }
        .jeecg-loader .bar:nth-child(3) { animation-delay: -0.15s; }
        .jeecg-loader .bar:nth-child(4) { animation-delay: 0s; }
        .jeecg-loader .bar:nth-child(5) { animation-delay: -0.15s; }

        @keyframes jeecgBounce {
          0%, 100% { height: 8px; opacity: 0.4; }
          50% { height: 56px; opacity: 1; }
        }

        /* ===== 文案 ===== */
        .app-loading-brand {
          text-align: center;
          display: flex;
          flex-direction: column;
          align-items: center;
          gap: 6px;
        }

        .app-loading-title {
          font-size: 22px;
          font-weight: 700;
          color: #0f172a;
          letter-spacing: 0.4px;
          line-height: 1.4;
        }

        .app-loading-sub {
          font-size: 13px;
          color: #64748b;
          letter-spacing: 0.4px;
        }

        /* ===== 进度条 ===== */
        .app-loading-progress {
          width: 220px;
          height: 3px;
          background: rgba(91, 108, 255, 0.1);
          border-radius: 999px;
          overflow: hidden;
          position: relative;
        }

        .app-loading-progress::before {
          content: '';
          position: absolute;
          left: 0;
          top: 0;
          bottom: 0;
          width: 40%;
          background: linear-gradient(90deg, rgba(91, 108, 255, 0), #5b6cff, rgba(91, 108, 255, 0));
          border-radius: 999px;
          animation: jeecgSlide 1.4s cubic-bezier(0.4, 0, 0.2, 1) infinite;
        }

        @keyframes jeecgSlide {
          0% { left: -40%; }
          100% { left: 100%; }
        }

        /* ===== 暗色主题 ===== */
        html[data-theme='dark'] .app-loading {
          background:
            radial-gradient(circle at 28% 22%, rgba(91, 108, 255, 0.14), transparent 45%),
            radial-gradient(circle at 75% 78%, rgba(160, 130, 255, 0.10), transparent 45%),
            linear-gradient(180deg, #0f172a 0%, #1a2440 100%);
          color: rgba(255, 255, 255, 0.92);
        }

        html[data-theme='dark'] .app-loading::before {
          background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1.5px);
        }

        html[data-theme='dark'] .app-loading-title {
          color: rgba(255, 255, 255, 0.92);
        }

        html[data-theme='dark'] .app-loading-sub {
          color: rgba(255, 255, 255, 0.55);
        }
      </style>
      <div class="app-loading">
        <div class="app-loading-wrap">
          <!-- 跳动方块 Loader -->
          <div class="jeecg-loader" role="status" aria-label="正在加载">
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
            <span class="bar"></span>
          </div>

          <!-- 品牌文案 -->
          <div class="app-loading-brand">
            <div class="app-loading-title"><%= title %></div>
            <div class="app-loading-sub">正在为您准备工作台…</div>
          </div>

          <!-- 进度条 -->
          <div class="app-loading-progress"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
    <!-- 百度统计 -->
    <script>
      var _hmt = _hmt || [];
      (function() {
        var hm = document.createElement("script");
        hm.src = "https://hm.baidu.com/hm.js?0febd9e3cacb3f627ddac64d52caac39";
        var s = document.getElementsByTagName("script")[0];
        s.parentNode.insertBefore(hm, s);
      })();
    </script>

  </body>
</html>
